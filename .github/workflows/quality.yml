name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Deliberately one PHP runtime, not the `run-tests.yml` matrix. Pint reads
      # syntax; Rector takes its target from `composer.json`'s `require.php`
      # (`withPhpSets()`), not from the runtime. PHPStan is the one that follows the
      # runtime, so it runs TWICE below — once here at the ceiling, once at the
      # floor through `phpstan-floor.neon`, which explains why a `phpVersion` range
      # cannot do it in one. Coverage, type coverage and profanity execute the suite
      # once, at 8.5 only: `run-tests.yml`'s matrix proves the suite PASSES under
      # 8.4, but nothing re-measures coverage there — a cost trade-off, not a proven
      # equivalence. Pinned to the ceiling, 8.5, to match the Docker dev image.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Pint, PHPStan and Rector all key their caches on file content, config and tool
      # version, so a stale entry cannot hide an error — the key below only decides how
      # often the cache is a hit.
      - name: Cache the analysers
        uses: actions/cache@v6
        with:
          path: .cache
          key: analysers-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock', 'pint.json', 'phpstan.neon', 'phpstan-floor.neon', 'rector.php') }}
          restore-keys: analysers-${{ runner.os }}-php8.5-

      - name: Pint
        run: vendor/bin/pint --test --cache-file=.cache/pint.cache --parallel

      - name: PHPStan
        run: |
          vendor/bin/phpstan analyse --error-format=github --memory-limit=1G
          vendor/bin/phpstan analyse -c phpstan-floor.neon --error-format=github --memory-limit=1G

      - name: Rector
        run: vendor/bin/rector process --dry-run

      - name: Coverage
        run: php -d zend.assertions=1 -d pcov.directory=src vendor/bin/pest --ci --parallel --coverage --min=100

      - name: Type coverage
        run: php -d zend.assertions=1 vendor/bin/pest --type-coverage --min=100

      - name: Profanity
        run: vendor/bin/pest --profanity

      # The seventh of eight gates. It exists because v1.1.0 shipped a Critical
      # that 660 PHP tests could not see: the only JS checks this package had
      # asserted that a string was present in the source file.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: verify/package-lock.json

      - name: Verify the JS against Alpine's reactivity
        run: cd verify && npm ci && node verify-reach-of.mjs && node verify-select-sequencing.mjs

      # The eighth gate. A duplicate name among the suite's global test helpers
      # is a fatal at PHP's load phase, not a failing test: the run dies before
      # Pest executes a single assertion, so no test inside the suite can catch
      # it (see `helpers` in the Makefile). Plain text over `tests/*.php`, so it
      # needs neither PHP nor the container.
      - name: Duplicate test helpers
        run: |
          dup=$(grep -rhoE '^function [a-zA-Z_][a-zA-Z0-9_]*' tests/ --include=*.php | awk '{print $2}' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo 'Duplicate global test helpers:'
            echo "$dup"
            exit 1
          fi
          echo 'No duplicate global test helpers.'
