name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Pint, PHPStan and Rector all key their caches on file content, config and tool
      # version, so a stale entry cannot hide an error — the key below only decides how
      # often the cache is a hit.
      - name: Cache the analysers
        uses: actions/cache@v4
        with:
          path: .cache
          key: analysers-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock', 'pint.json', 'phpstan.neon', 'rector.php') }}
          restore-keys: analysers-${{ runner.os }}-php8.5-

      - name: Pint
        run: vendor/bin/pint --test --cache-file=.cache/pint.cache --parallel

      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --memory-limit=1G

      - name: Rector
        run: vendor/bin/rector process --dry-run

      - name: Coverage
        run: php -d zend.assertions=1 -d pcov.directory=src vendor/bin/pest --ci --parallel --coverage --min=100

      - name: Type coverage
        run: php -d zend.assertions=1 vendor/bin/pest --type-coverage --min=100

      - name: Profanity
        run: vendor/bin/pest --profanity
