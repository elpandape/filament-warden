name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `fetch-depth: 0` is belt and braces, not a requirement: measured against
      # the live remote, a depth-1 tag fetch already brings the annotated tag
      # OBJECT down with its subject intact, and CHANGELOG.md with it. It is kept
      # because a release is rare and one full clone is cheap, while the shallow
      # path depends on an internal refspec of a third-party action.
      #
      # `persist-credentials: false` because nothing after this step uses git over
      # the network — `gh` carries its own token — so there is no reason to leave a
      # `contents: write` credential in `.git/config` for the rest of the job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # AGENTS.md §8: a release is the tag, the GitHub release with the CHANGELOG's
      # own notes for that version, and the Packagist check — never the tag alone.
      # This step supplies the notes half; a version with no matching CHANGELOG
      # section fails the job instead of publishing an empty release.
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"

          awk -v version="$version" '
            BEGIN { gsub(/\./, "\\.", version) }
            $0 ~ ("^## \\[" version "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          # Keep a Changelog leaves a blank line on each side of a section; trim
          # one from each end so the release body neither opens nor closes on it.
          sed -i -e '1{/^$/d}' -e '${/^$/d}' "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG.md section '## [$version]' found — refusing to publish an empty release." >&2
            exit 1
          fi

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      # The title convention this project already uses by hand is
      # "<tag> — <headline>" (AGENTS.md §8, `gh release create ... --title`), and
      # the annotated tag's subject is the only place a machine can read it from —
      # CHANGELOG.md does not carry it. It is not, however, where the shipped
      # titles came from: of the tags that had a release when this was measured,
      # only 10 of 26 subjects matched
      # it — 11 differ by the case of one word, and the same 5 that differ completely
      # are the 5 whose subject carries the headline alone, with no "<tag> — " on the
      # front. All 26 were typed by hand at `gh release create` time. From here on the
      # annotation IS the title, verbatim and unedited, so `git tag -a` has to carry
      # the whole "<tag> — <headline>" string; one of those five shapes would ship a
      # release title with no version in it.
      #
      # The guard is on `%(objecttype)`, NOT on the subject coming back empty.
      # `%(contents:subject)` on a ref that points straight at a commit — which is
      # what a lightweight tag is — returns that COMMIT's subject, never an empty
      # string, so a `${subject:-…}` fallback alone can never fire. Only an
      # annotated tag object carries a subject that means what this title claims
      # it means. Measured through this job on a real lightweight tag: without the
      # `%(objecttype)` guard the title handed to `gh` was the commit message of
      # whatever the tag pointed at; with it, the bare tag name.
      - name: Read the release title from the tag
        id: title
        run: |
          ref="refs/tags/${GITHUB_REF_NAME}"
          objecttype="$(git for-each-ref "$ref" --format='%(objecttype)')"

          if [ "$objecttype" = "tag" ]; then
            subject="$(git for-each-ref "$ref" --format='%(contents:subject)')"
          else
            subject=""
          fi

          title="${subject:-$GITHUB_REF_NAME}"

          # The one half of the convention a machine can check. The other half —
          # that it is in English — is not a question a workflow can answer, and
          # AGENTS.md §8 says so; this is what is left, and it is worth having:
          # five of the tags that already have a release carry the headline with
          # no version on the front — measured against `c864846`, when there were
          # 29 of them — and from `1.5.0` on that string IS the release title,
          # verbatim.
          case "$title" in
            "$GITHUB_REF_NAME") ;;
            # `?*` and not `*`: an em dash with nothing after it is not a headline.
            "$GITHUB_REF_NAME — "?*) ;;
            *)
              echo "::error::The tag's subject is [$title]. It becomes the release title verbatim, so it has to read '$GITHUB_REF_NAME — <headline>'." >&2
              exit 1
              ;;
          esac

          echo "title=$title" >> "$GITHUB_OUTPUT"

      # `-rc.` and other semver pre-release suffixes are marked as such, matching
      # how this project's own v1.0.0-rc.1 release was flagged.
      #
      # TITLE and NOTES_FILE go through `env:`, never spliced into the script as
      # `${{ }}` text. The Actions runner expands a `${{ }}` inside `run:` into the
      # script BEFORE bash parses it, so a tag subject containing `$(…)` runs that
      # command in a job holding `contents: write` — and whoever can push a tag is
      # exactly whoever this workflow reacts to. Measured both ways on one payload:
      # spliced, the substitution executed and its output replaced the text, so the
      # title shipped mangled as well; through `env:`, `gh` received the subject
      # verbatim as a single argument and nothing ran.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.title.outputs.title }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          prerelease_flag=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            "${prerelease_flag[@]}"
